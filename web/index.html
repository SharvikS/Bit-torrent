<!doctype html>
<html lang="en" data-theme="midnight" data-accent="violet" data-density="cozy" data-motion="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Fission</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%238b5cf6'/><ellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%238b5cf6' stroke-width='2'/><ellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%238b5cf6' stroke-width='2' transform='rotate(60 16 16)'/><ellipse cx='16' cy='16' rx='14' ry='6' fill='none' stroke='%238b5cf6' stroke-width='2' transform='rotate(120 16 16)'/></svg>">
<script>
/* Appearance is restored before the first paint. app.js loads as a module,
   which is deferred by definition — without this the page would render in
   the default theme for a frame and then repaint into the chosen one. */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('fission.prefs.v1') || '{}');
    var alias = { dark: 'midnight', light: 'paper', auto: 'system' };
    var t = alias[p.theme] || p.theme || 'midnight';
    if (t === 'system') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'midnight';
    }
    var r = document.documentElement;
    r.dataset.theme = t;
    if (p.accent) r.dataset.accent = p.accent;
    if (p.density) r.dataset.density = p.density;
    if (p.motion) r.dataset.motion = p.motion;
    r.style.colorScheme = (t === 'paper' || t === 'sandstone') ? 'light' : 'dark';
  } catch (e) { /* private mode or blocked storage: defaults are fine */ }
})();
</script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ login gate (only shown when the daemon requires a password) ══ -->
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <div class="login-mark" aria-hidden="true"></div>
    <h1>Fission</h1>
    <p class="muted">This instance is password protected.</p>
    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary block" type="submit">Unlock</button>
    <div class="login-error" id="login-error" hidden></div>
  </form>
</div>

<a class="skip-link" href="#table">Skip to torrent list</a>
<div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="app" hidden>

  <!-- ══════════════════════ top bar ══════════════════════ -->
  <header class="topbar" role="banner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <span class="brand-name">Fission</span>
    </div>

    <button class="btn primary" id="btn-add" title="Add torrent — N">
      <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14"/></svg>
      <span>Add</span>
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Filter torrents…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div class="spacer"></div>

    <div class="rates" title="Session transfer rates">
      <canvas id="spark" width="150" height="34" aria-hidden="true"></canvas>
      <div class="rate-col">
        <div class="rate down"><svg viewBox="0 0 24 24" class="ico"><path d="M12 4v14M6 13l6 6 6-6"/></svg><span id="rate-down">0 B/s</span></div>
        <div class="rate up"><svg viewBox="0 0 24 24" class="ico"><path d="M12 20V6M6 11l6-6 6 6"/></svg><span id="rate-up">0 B/s</span></div>
      </div>
    </div>

    <button class="btn icon" id="btn-alt" title="Alternative speed limits — T">
      <svg viewBox="0 0 24 24" class="ico"><path d="M5 18a9 9 0 1 1 14 0"/><path d="M12 14l4-4"/></svg>
    </button>
    <button class="btn icon" id="btn-theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" class="ico ico-moon"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      <svg viewBox="0 0 24 24" class="ico ico-sun"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>
    </button>
    <button class="btn icon" id="btn-settings" title="Settings — ,">
      <svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3V1a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15 3a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 9h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1z"/></svg>
    </button>
  </header>

  <div class="body">

    <!-- ══════════════════════ sidebar ══════════════════════ -->
    <aside class="sidebar" id="sidebar" aria-label="Filters">
      <nav class="filters" id="status-filters"></nav>

      <div class="side-group">
        <div class="side-head">
          <span>Categories</span>
          <button class="mini" id="btn-new-category" title="New category">+</button>
        </div>
        <nav class="filters" id="category-filters"></nav>
      </div>

      <div class="side-group">
        <div class="side-head"><span>Tags</span></div>
        <nav class="filters" id="tag-filters"></nav>
      </div>

      <div class="side-foot">
        <div class="disk">
          <div class="disk-row"><span>Free space</span><b id="free-space">—</b></div>
          <div class="disk-row muted"><span id="dl-path">—</span></div>
        </div>
      </div>
    </aside>

    <!-- ══════════════════════ main ══════════════════════ -->
    <main class="main">
      <div class="toolbar" id="toolbar" role="toolbar" aria-label="Torrent actions">
        <div class="tb-group">
          <button class="btn icon" data-act="resume" title="Resume — Space" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M7 4l13 8-13 8z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="btn icon" data-act="pause" title="Pause — Space" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M8 4h3v16H8zM13 4h3v16h-3z" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="btn icon danger" data-act="remove" title="Remove — Delete" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
        <div class="tb-sep"></div>
        <div class="tb-group">
          <button class="btn icon" data-act="queue-top" title="Move to top" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 4h14M12 20V9M7 14l5-5 5 5"/></svg>
          </button>
          <button class="btn icon" data-act="queue-up" title="Move up" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
          </button>
          <button class="btn icon" data-act="queue-down" title="Move down" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v13M6 12l6 6 6-6"/></svg>
          </button>
          <button class="btn icon" data-act="queue-bottom" title="Move to bottom" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M5 20h14M12 4v11M7 10l5 5 5-5"/></svg>
          </button>
        </div>
        <div class="tb-sep"></div>
        <div class="tb-group">
          <button class="btn icon" data-act="recheck" title="Force recheck" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>
          </button>
          <button class="btn icon" data-act="reannounce" title="Reannounce to trackers" disabled>
            <svg viewBox="0 0 24 24" class="ico"><path d="M4.9 4.9a10 10 0 0 0 0 14.2M19.1 4.9a10 10 0 0 1 0 14.2M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/></svg>
          </button>
        </div>

        <div class="spacer"></div>

        <div class="selection-info" id="selection-info"></div>

        <button class="btn ghost" id="btn-detail-toggle" title="Toggle details — I">
          <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
      </div>

      <div class="table-wrap" id="table-wrap">
        <table class="torrents" id="table" aria-label="Torrents" aria-rowcount="0">
          <thead><tr id="head-row"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="skeleton-wrap" id="skeleton" aria-hidden="true"></div>
        <div class="empty" id="empty" hidden>
          <div class="empty-mark" aria-hidden="true"></div>
          <h2>Nothing here yet</h2>
          <p>Drop a <code>.torrent</code> file anywhere, paste a magnet link, or press <kbd>N</kbd>.</p>
          <button class="btn primary" id="btn-add-empty">Add your first torrent</button>
        </div>
      </div>
    </main>

    <!-- ══════════════════════ detail panel ══════════════════════ -->
    <aside class="detail" id="detail" hidden aria-label="Torrent details">
      <button class="detail-resize" id="detail-resize" aria-label="Resize details panel"
              title="Drag to resize — double-click to reset"></button>
      <div class="detail-head">
        <div class="detail-title" id="detail-title">—</div>
        <button class="btn icon" id="btn-detail-close" title="Close">
          <svg viewBox="0 0 24 24" class="ico"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="tabs" id="detail-tabs" role="tablist">
        <button class="tab active" data-tab="general" role="tab" aria-selected="true">General</button>
        <button class="tab" data-tab="files" role="tab" aria-selected="false">Files</button>
        <button class="tab" data-tab="peers" role="tab" aria-selected="false">Peers</button>
        <button class="tab" data-tab="trackers" role="tab" aria-selected="false">Trackers</button>
        <button class="tab" data-tab="pieces" role="tab" aria-selected="false">Pieces</button>
        <button class="tab" data-tab="speed" role="tab" aria-selected="false">Speed</button>
      </div>
      <div class="detail-body" id="detail-body" role="tabpanel" tabindex="0"></div>
    </aside>
  </div>

  <!-- ══════════════════════ status bar ══════════════════════ -->
  <footer class="statusbar" role="contentinfo">
    <span class="conn" id="conn"><i></i><span>Connecting…</span></span>
    <span class="sep"></span>
    <span id="stat-counts">—</span>
    <div class="spacer"></div>
    <span id="stat-dht" title="DHT nodes">DHT —</span>
    <span class="sep"></span>
    <span id="stat-port" title="Incoming port">Port —</span>
    <span class="sep"></span>
    <span id="stat-session" title="Transferred this session">↓ 0 B  ↑ 0 B</span>
    <span class="sep"></span>
    <span id="stat-version" class="muted"></span>
  </footer>
</div>

<!-- ══════════════════════ overlays ══════════════════════ -->
<div class="drop-veil" id="drop-veil" hidden>
  <div class="drop-inner">
    <svg viewBox="0 0 24 24" class="ico big"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <div>Drop .torrent files to add</div>
  </div>
</div>

<div class="modal-root" id="modal-root" hidden></div>
<div class="menu" id="context-menu" hidden></div>
<div class="toasts" id="toasts"></div>

<div class="palette-root" id="palette" hidden>
  <div class="palette">
    <input id="palette-input" placeholder="Type a command…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="palette-list"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
